<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The scene is a fixed 16:9 stage that already scales itself to the viewport,
     so there is nothing to zoom INTO: pinching only breaks the letterboxing and
     scrolls the desk half off screen. maximum-scale + user-scalable=no turn it
     off on touch; game.js blocks the desktop routes (ctrl+wheel, ctrl+/-) and
     Safari's gesture events, which ignore this tag. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Letters</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&family=Lilita+One&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="viewport">
  <!-- #stage is the letterboxed 16:9 scene. Everything inside is positioned
       in percentages of it; see styles.css. -->
  <div id="stage">
    <!-- #world is the shake/pull-back target, so those never clobber the
         stage's own fit transform. -->
    <div id="world">

      <div id="desk"></div>

      <!-- ============================================================ -->
      <!-- The letter card, inlined so its groups are addressable.        -->
      <!--                                                               -->
      <!-- The artwork is one <symbol>, instanced by every copy of it:    -->
      <!-- the card itself and each sheet in the inbox pile (miniCard).   -->
      <!-- It is a single un-sliced instance, so no seam can ever show.   -->
      <!--                                                               -->
      <!-- There is no fold and no drawn envelope any more: a sheet       -->
      <!-- arrives and the same sheet leaves, so the three 3D bands and   -->
      <!-- the back/front/flap that sandwiched this layer are gone.       -->
      <!-- envelope.png still stands in for a posted letter on the piles  -->
      <!-- and in the level-complete row.                                 -->
      <!-- ============================================================ -->
      <div id="card-layer">
        <svg id="card-defs" width="0" height="0" aria-hidden="true" focusable="false">
          <defs>
            <pattern id="airmail" width="40" height="42" patternUnits="userSpaceOnUse"
                     patternTransform="rotate(-52)">
              <rect width="40" height="42" fill="#FBEEDC"/>
              <rect width="40" height="13" y="0"  fill="#FB9B96"/>
              <rect width="40" height="13" y="21" fill="#9DBBD5"/>
            </pattern>
            <clipPath id="clip-card">
              <path d="M15.4 26.3C15.4 14.15 25.25 4.3 37.4 4.3H1136.9C1149.05 4.3 1158.9 14.15 1158.9 26.3V617.3C1158.9 629.45 1149.05 639.3 1136.9 639.3H37.4C25.25 639.3 15.4 629.45 15.4 617.3Z"/>
            </clipPath>
            <!-- The Figma export (94:28) draws the card as a slight trapezoid:
                 its left edge drifts 10.2 units outward and its right edge 7.5
                 units over the 591-unit drop, and the stroke on the lower
                 corners fell outside the viewBox and was clipped. Against the
                 vertical airmail stripes that read as a bent border rather
                 than as perspective, so the outline is a true rounded
                 rectangle here: x 15.4..1158.9, y 4.3..639.3, r 22 — the mean
                 of the export's own extremes, so no corner moves more than
                 about 5 units and the card sits exactly where it did. -->
            <symbol id="card-art" viewBox="10.3 4.3 1152.34 635" overflow="visible">
              <path id="card-paper"
                    d="M15.4 26.3C15.4 14.15 25.25 4.3 37.4 4.3H1136.9C1149.05 4.3 1158.9 14.15 1158.9 26.3V617.3C1158.9 629.45 1149.05 639.3 1136.9 639.3H37.4C25.25 639.3 15.4 629.45 15.4 617.3Z"
                    fill="#FBEEDC" stroke="#8C3A00" stroke-width="4"/>
              <g class="card-stripes" clip-path="url(#clip-card)">
                <rect x="21.4"   y="10.3" width="26.3" height="623"/>
                <rect x="1126.6" y="10.3" width="26.3" height="623"/>
              </g>
            </symbol>
          </defs>
        </svg>

        <div id="card-flat">
          <svg viewBox="10.3 4.3 1152.34 635" preserveAspectRatio="none">
            <use href="#card-art" x="10.3" y="4.3" width="1152.34" height="635"/>
          </svg>
        </div>

        <!-- "letter glows" — the sheet's completion beat for 4D and the Final
             Letter, the two letters where finishing means finishing several
             sentences at once. Its own element rather than a filter on
             #card-layer, whose filter is the card's shadow and would be
             clobbered. It sits under #sentence, so the paper glows behind the
             words rather than washing them out. -->
        <div id="card-glow"></div>

      </div>

      <!-- the sentence sits above the card, outside the SVG, so the card's
           own transforms never distort live text -->
      <p id="sentence" aria-live="off"></p>

      <!-- one generous invisible drop zone per unsolved target; also hosts
           the pulse, glow and ghost-impression states -->
      <div id="targets"></div>

      <div id="inbox"></div>
      <div id="outbox"></div>
      <div id="mailbag"></div>

      <!-- READY TO POST belongs to the level-complete ceremony, where the
           whole set takes it together — see #finale in game.js. Nothing
           franks a single letter on the desk any more. -->

      <img id="tray" src="assets/stamp-tray.png" alt="" draggable="false">
      <div id="tray-lip"></div>
      <div id="stamps" role="group" aria-label="Stamps"></div>

      <!-- progress HUD -->
      <div id="hud">
        <div id="hud-pill"><div id="hud-inner"></div></div>
        <p id="hud-count">01/8</p>
        <div id="hud-pips"></div>
      </div>

      <!-- Instruction panel. Every coaching line lands here: the level
           instruction, the escalating error nudges, praise, and a rotating
           tip when the learner goes quiet. It runs along the top of the desk
           and stops short of the HUD, so the two read as one band. Drawn
           entirely in CSS — there is no character art. -->
      <div id="coach" data-tone="neutral">
        <img id="coach-badge" src="assets/coach-avatar.png" alt="" draggable="false" aria-hidden="true">
        <p id="coach-line"></p>
      </div>

      <!-- Temporary review control: all levels in levelling-sheet order. -->
      <nav id="temp-level-nav" aria-label="Temporary level navigation">
        <span>Jump to</span>
        <div id="temp-level-buttons"></div>
      </nav>

      <!-- The third-miss hand. It takes the right stamp off the tray and
           drops it where it belongs, because by the third try the child has
           been TOLD twice and telling again is not working. It also shows the
           move when the practice screen goes quiet.

           Supplied artwork, trimmed to its own ink: 61 x 75. It replaced a
           hand built out of four CSS-styled rounded rectangles, painted twice
           to fake a union — a stand-in for exactly this file. The FINGERTIP is
           the hot spot, at 32.79% across and 4% down; game.js pins it to the
           stamp and then to the target (HAND), and styles.css puts the
           transform origin on the same point. -->
      <div id="hand-hint" aria-hidden="true">
        <img src="assets/hand.png" alt="" draggable="false">
      </div>

      <div id="finale"></div>
    </div>

    <!-- ============================================================ -->
    <!-- Title card and the two films.                                 -->
    <!--                                                               -->
    <!-- Siblings of #world, not children of it: #world is the shake    -->
    <!-- and pull-back target, and neither of these should ever be      -->
    <!-- shaken by a stamp landing behind them.                         -->
    <!--                                                               -->
    <!-- PLAY is where the artwork puts it: the button was drawn on its -->
    <!-- own 1920x1080 canvas, centred horizontally and 74 design px    -->
    <!-- below the middle. The art is cropped to that box and the box   -->
    <!-- is in game.js as L.play, so one set of numbers places it.       -->
    <!-- ============================================================ -->
    <div id="title" hidden>
      <img id="cover" src="assets/cover.jpg" alt="The Punctuation Puzzle" draggable="false">
    </div>

    <!-- One <video>, its src set only when a film is wanted:
         preload="none" keeps 20 MB of video out of the boot payload, which
         the suite holds under 2 MB. -->
    <div id="movie" hidden>
      <video id="film" preload="none" playsinline></video>
    </div>

    <!-- ONE PLAY BUTTON, USED TWICE. It is a sibling of both layers rather
         than a child of the title card, because it is wanted over each of
         them in turn and they share the stage's coordinate space: on the
         cover, and then again on the opening film's last frame, where the
         children are pointing at a PLAY drawn into the picture. game.js
         places it from L.play and L.introPlay. -->
    <button id="play" type="button" aria-label="Play" hidden>
      <img src="assets/play-button.png" alt="" draggable="false">
    </button>
  </div>
</div>

<!-- screen-reader announcements -->
<p id="say" class="sr-only" role="status" aria-live="polite"></p>

<script src="game.js"></script>
</body>
</html>
