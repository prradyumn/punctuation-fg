<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Letters</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="viewport">
  <!-- #stage is the letterboxed 16:9 scene. Everything inside is positioned
       in percentages of it; see styles.css. -->
  <div id="stage">
    <!-- #world is the shake/pull-back target, so those never clobber the
         stage's own fit transform. -->
    <div id="world">

      <div id="desk"></div>

      <!-- ============================================================ -->
      <!-- The letter card, inlined so its groups are addressable.       -->
      <!-- One <symbol> holds the artwork; it is instanced four times:   -->
      <!-- once flat (what you see at rest) and once per fold band.      -->
      <!-- Only one of those is ever visible — a single flat instance    -->
      <!-- cannot show a seam between bands at any stage scale.          -->
      <!-- ============================================================ -->
      <!-- ============================================================ -->
      <!-- The letter card.                                              -->
      <!--                                                               -->
      <!-- The artwork is one <symbol>, instanced by every copy below.   -->
      <!-- #card-flat is a single un-sliced instance and is what is on    -->
      <!-- screen at rest, so no seam between slices can ever show.       -->
      <!--                                                               -->
      <!-- #card-fold is the folding version: three HTML bands, each      -->
      <!-- showing a third of the same artwork. It is HTML rather than    -->
      <!-- SVG groups because browsers do not honour transform-style:     -->
      <!-- preserve-3d on SVG elements — an SVG <g> rotated in X is       -->
      <!-- flattened to a vertical squash, which reads as the paper being -->
      <!-- sliced off rather than folded over.                            -->
      <!-- ============================================================ -->
      <div id="card-layer">
        <svg id="card-defs" width="0" height="0" aria-hidden="true" focusable="false">
          <defs>
            <pattern id="airmail" width="40" height="42" patternUnits="userSpaceOnUse"
                     patternTransform="rotate(-52)">
              <rect width="40" height="42" fill="#FBEEDC"/>
              <rect width="40" height="13" y="0"  fill="#FB9B96"/>
              <rect width="40" height="13" y="21" fill="#9DBBD5"/>
            </pattern>
            <clipPath id="clip-card">
              <path d="M15.4 26.3C15.4 14.15 25.25 4.3 37.4 4.3H1136.9C1149.05 4.3 1158.9 14.15 1158.9 26.3V617.3C1158.9 629.45 1149.05 639.3 1136.9 639.3H37.4C25.25 639.3 15.4 629.45 15.4 617.3Z"/>
            </clipPath>
            <!-- The Figma export (94:28) draws the card as a slight trapezoid:
                 its left edge drifts 10.2 units outward and its right edge 7.5
                 units over the 591-unit drop, and the stroke on the lower
                 corners fell outside the viewBox and was clipped. Against the
                 vertical airmail stripes that read as a bent border rather
                 than as perspective, so the outline is a true rounded
                 rectangle here: x 15.4..1158.9, y 4.3..639.3, r 22 — the mean
                 of the export's own extremes, so no corner moves more than
                 about 5 units and the card sits exactly where it did. -->
            <symbol id="card-art" viewBox="10.3 4.3 1152.34 635" overflow="visible">
              <path id="card-paper"
                    d="M15.4 26.3C15.4 14.15 25.25 4.3 37.4 4.3H1136.9C1149.05 4.3 1158.9 14.15 1158.9 26.3V617.3C1158.9 629.45 1149.05 639.3 1136.9 639.3H37.4C25.25 639.3 15.4 629.45 15.4 617.3Z"
                    fill="#FBEEDC" stroke="#8C3A00" stroke-width="4"/>
              <g class="card-stripes" clip-path="url(#clip-card)">
                <rect x="21.4"   y="10.3" width="26.3" height="623"/>
                <rect x="1126.6" y="10.3" width="26.3" height="623"/>
              </g>
            </symbol>
          </defs>
        </svg>

        <!-- at rest: one un-sliced instance -->
        <div id="card-flat">
          <svg viewBox="10.3 4.3 1152.34 635" preserveAspectRatio="none">
            <use href="#card-art" x="10.3" y="4.3" width="1152.34" height="635"/>
          </svg>
        </div>

        <!-- while folding: three bands in real 3D -->
        <div id="card-fold" hidden>
          <div class="fband" id="fb-top">
            <div class="art"><svg viewBox="10.3 4.3 1152.34 635" preserveAspectRatio="none">
              <use href="#card-art" x="10.3" y="4.3" width="1152.34" height="635"/></svg></div>
            <i class="shade"></i><i class="crease"></i>
          </div>
          <div class="fband" id="fb-mid">
            <div class="art"><svg viewBox="10.3 4.3 1152.34 635" preserveAspectRatio="none">
              <use href="#card-art" x="10.3" y="4.3" width="1152.34" height="635"/></svg></div>
            <!-- shadows the folding thirds cast down onto the middle: this is
                 what actually makes a fold look like paper rather than a
                 panel sliding over -->
            <i class="cast cast-from-bot"></i>
            <i class="cast cast-from-top"></i>
          </div>
          <div class="fband" id="fb-bot">
            <div class="art"><svg viewBox="10.3 4.3 1152.34 635" preserveAspectRatio="none">
              <use href="#card-art" x="10.3" y="4.3" width="1152.34" height="635"/></svg></div>
            <i class="shade"></i><i class="crease"></i>
          </div>
        </div>

        <!-- the flap that swings open in `open` -->
        <svg id="card-flap-svg" viewBox="10.3 4.3 1152.34 635" preserveAspectRatio="none"
             aria-hidden="true" focusable="false">
          <g id="card-flap">
            <path d="M37.4 4.3 H1136.9 L587.15 330 Z"
                  fill="#F0DFC4" stroke="#8C3A00" stroke-width="4" stroke-linejoin="round"/>
          </g>
        </svg>
      </div>

      <!-- the sentence sits above the card, outside the SVG, so the fold
           transforms never distort live text -->
      <p id="sentence" aria-live="off"></p>

      <!-- one generous invisible drop zone per unsolved target; also hosts
           the pulse, glow and ghost-impression states -->
      <div id="targets"></div>

      <div id="inbox"></div>
      <div id="outbox"></div>
      <div id="mailbag"></div>

      <!-- the envelope the card becomes -->
      <img id="envelope" src="assets/envelope.png" alt="" draggable="false">
      <img id="seal" src="assets/ready-to-post.png" alt="" draggable="false">
      <div id="flash"></div>

      <img id="tray" src="assets/stamp-tray.png" alt="" draggable="false">
      <div id="tray-lip"></div>
      <div id="stamps" role="group" aria-label="Stamps"></div>

      <!-- progress HUD -->
      <div id="hud">
        <div id="hud-pill"><div id="hud-inner"></div></div>
        <p id="hud-count">01/8</p>
        <div id="hud-pips"></div>
      </div>

      <!-- Instruction panel. Every coaching line lands here: the level
           instruction, the escalating error nudges, praise, and a rotating
           tip when the learner goes quiet. It runs along the top of the desk
           and stops short of the HUD, so the two read as one band. Drawn
           entirely in CSS — there is no character art. -->
      <div id="coach" data-tone="neutral">
        <span id="coach-badge" aria-hidden="true"></span>
        <p id="coach-line"></p>
      </div>

      <div id="finale"></div>
    </div>
  </div>
</div>

<!-- screen-reader announcements -->
<p id="say" class="sr-only" role="status" aria-live="polite"></p>

<script src="game.js"></script>
</body>
</html>
